name: PTU checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install from the lock file
        run: |
          python -m venv .venv-ptu
          .venv-ptu/bin/python -m pip install -r requirements-ptu.lock
      # Linux has no Seatbelt sandbox: workstation, isolation and coding-route
      # tests skip with a fixed reason and must be run on macOS.
      - run: .venv-ptu/bin/python -m pytest ptu/tests -q -rs
  graders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install from the lock file
        run: |
          python -m venv .venv-ptu
          .venv-ptu/bin/python -m pip install -r requirements-ptu.lock
      - name: Easy tier golden trajectories
        run: .venv-ptu/bin/python -m ptu.checker.golden_runner --all --split demo
      - name: Release task set (goldens, review evidence, extreme routes)
        run: .venv-ptu/bin/python scripts/check_release_tasks.py --routes
      - name: Application fidelity suites
        run: |
          for app in codehost chat crm payments; do
            .venv-ptu/bin/python -m ptu.harness.cli fidelity --app "$app"
          done
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks 8.24.3
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run: /tmp/gitleaks detect --source . --no-banner --redact
